name: ARMhf container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armhf-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armhf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          upstream=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          {
            echo "version=${upstream}-armhf"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "time=$(git show -s --format=%cI HEAD)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build ARMv7 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm/v7
          load: true
          tags: pt-tools:armhf-test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            BUILD_ENV=remote
            TAG=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            COMMIT_ID=${{ steps.meta.outputs.revision }}
          cache-from: type=gha,scope=armhf
          cache-to: type=gha,scope=armhf,mode=max

      - name: Run the ARMhf container
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' pt-tools:armhf-test)" = linux/arm
          docker run --detach --name pt-tools-armhf --platform linux/arm/v7 \
            --publish 127.0.0.1:18080:8080 pt-tools:armhf-test
          trap 'docker logs pt-tools-armhf; docker rm -f pt-tools-armhf' EXIT
          curl --retry 12 --retry-connrefused --retry-delay 1 \
            --max-time 5 --fail --silent --show-error http://127.0.0.1:18080/login \
            --output "/tmp/pt-tools-armhf-login.html"
          grep -qi '<html' "/tmp/pt-tools-armhf-login.html"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          set -euo pipefail
          for tag in "$VERSION-${REVISION:0:12}" "$VERSION" armhf; do
            docker tag pt-tools:armhf-test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
